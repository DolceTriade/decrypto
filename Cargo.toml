[package]
name = "decrypto"
version = "0.2.0"
authors = ["dolcetriade <vcelestialragev@gmail.com>"]
edition = "2024"

[dependencies]
actix-web = "4"
rand = "0.6.5"
indexmap = "1.0.2"
serde_json = "1.0.39"
serde = { version = "1.0.91", features = ["derive"] }
futures = "0.3"
actix-session = { version = "0.9", features = ["cookie-session"] }
actix-files = "0.6"
actix-web-actors = "4"
actix = "0.13"
uuid = { version = "1", features = ["v4"] }
log = "0.4.8"
simple-logging = "2.0.2"
